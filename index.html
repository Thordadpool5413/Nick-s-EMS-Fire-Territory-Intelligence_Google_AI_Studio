    <script>
      (function() {
        function isSuppressedError(err) {
          if (!err) return false;
          var str = typeof err === 'string' ? err : ((err.message || '') + ' ' + (err.stack || '') + ' ' + String(err));
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf("RPC 'Listen' stream") !== -1 ||
            str.indexOf('WebChannelConnection') !== -1 ||
            str.indexOf('transport errored') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isSuppressedError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isSuppressedError(event.error) || isSuppressedError(event.message)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a); }).join(' ');
          if (
            joined.indexOf("RPC 'Listen' stream") !== -1 ||
            joined.indexOf('WebChannelConnection') !== -1 ||
            joined.indexOf('transport errored') !== -1
          ) {
            return;
          }
          origWarn.apply(console, arguments);
        };

        var origErr = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a); }).join(' ');
          if (
            joined.indexOf('failed to connect to websocket') !== -1 ||
            joined.indexOf('WebSocket closed without opened') !== -1 ||
            joined.indexOf('WebChannelConnection') !== -1
          ) {
            return;
          }
          origErr.apply(console, arguments);
        };
      })();
    </script>
